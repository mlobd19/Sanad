services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: taamine
      POSTGRES_USER: taamine
      POSTGRES_PASSWORD: taamine
    volumes: [pgdata:/var/lib/postgresql/data]

  redis:
    image: redis:7

  web:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgres://taamine:taamine@db:5432/taamine
      REDIS_URL: redis://redis:6379/0
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,web
      ATTESTATION_VERIFY_BASE_URL: http://localhost:3000/v/
    command: >
      sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes: [./backend:/app]
    ports: ["8000:8000"]
    depends_on: [db, redis]

  frontend:
    image: node:22
    working_dir: /app
    environment:
      BACKEND_URL: http://web:8000
      NEXT_TELEMETRY_DISABLED: "1"
    command: sh -c "npm install && npm run dev"
    volumes: [./frontend:/app]
    ports: ["3000:3000"]
    depends_on: [web]

  worker:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgres://taamine:taamine@db:5432/taamine
      REDIS_URL: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: "false"
    command: celery -A config worker --beat -l info
    depends_on: [db, redis]

volumes:
  pgdata:
