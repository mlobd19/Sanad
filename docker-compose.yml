services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: taamine
      POSTGRES_USER: taamine
      POSTGRES_PASSWORD: taamine
    volumes: [pgdata:/var/lib/postgresql/data]

  redis:
    image: redis:7

  web:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgres://taamine:taamine@db:5432/taamine
      REDIS_URL: redis://redis:6379/0
    command: >
      sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes: [./backend:/app]
    ports: ["8000:8000"]
    depends_on: [db, redis]

  worker:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgres://taamine:taamine@db:5432/taamine
      REDIS_URL: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: "false"
    command: celery -A config worker --beat -l info
    depends_on: [db, redis]

volumes:
  pgdata:
